[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "recommend-engine"
version = "0.1.0"
description = "AI-Powered Product Recommendation Engine with Preference Volatility Modeling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Recommend Engine Team"}
]

dependencies = [
    # Core ML
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",

    # Graph Neural Networks
    "dgl>=1.1.0",

    # ANN Search
    "faiss-cpu>=1.7.4",

    # Serving
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Streaming & Data
    "aiokafka>=0.8.0",
    "redis[hiredis]>=5.0.0",
    "feast>=0.31.0",
    "pyspark>=3.4.0",

    # MLOps
    "mlflow>=2.5.0",
    "shap>=0.42.0",

    # Observability
    "prometheus-client>=0.17.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",

    # Utils
    "mmh3>=4.0.0",
    "sortedcontainers>=2.4.0",
    "orjson>=3.9.0",
    "msgpack>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
strict = false
ignore_missing_imports = true

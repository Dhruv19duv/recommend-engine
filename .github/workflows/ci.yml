name: Recommend Engine CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint & Format ───────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff mypy

      - name: Check formatting with Black
        run: black --check --line-length=100 --target-version=py310 src/ tests/ demos/

      - name: Lint with Ruff
        run: ruff check src/ --line-length=100 --select=E,F,I,N,W

      - name: Type check with Mypy
        run: mypy src/ --ignore-missing-imports --no-strict-optional --follow-imports=skip

  # ── Unit Tests ──────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libomp-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short -x \
            --ignore=tests/test_integration.py \
            -k "not Integration"

      - name: Run integration tests
        run: |
          python -m pytest tests/test_integration.py -v --tb=short -x

  # ── Demo Smoke Tests ────────────────────────────────────────
  demos:
    name: Demo Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test — Regret Minimizer Demo
        run: python -m demos.regret_minimizer_demo 2>&1

      - name: Smoke test — Preference Volatility Demo
        run: python -m demos.preference_volatility_demo 2>&1

      - name: Smoke test — Inventory Forecast Demo
        run: python -m demos.inventory_forecast_demo 2>&1

      - name: Smoke test — Anti-Echo-Chamber Demo
        run: python -m demos.anti_echo_chamber_demo 2>&1

      - name: Smoke test — Adversarial Simulation Demo
        run: python -m demos.adversarial_simulation_demo 2>&1

      - name: Smoke test — Life-Stage Diffusion Demo
        run: python -m demos.life_stage_diffusion_demo 2>&1

  # ── Dependency Audit ────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Security scan with Bandit
        run: bandit -r src/ -ll -x tests/,demos/

      - name: Dependency vulnerability check
        run: safety check --full-report
        continue-on-error: true
